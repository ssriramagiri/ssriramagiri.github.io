<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Näckrosvägen 29 — 3D model, sun study and furnishing planner</title>
  <meta name="description" content="A 3D model of a 1946 flat in Råsunda, Solna, with its neighbourhood, an hour-by-hour sunlight simulation and a drag-and-drop furnishing planner.">
  <meta name="author" content="Sai Sriramagiri">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/gif" href="/assets/sai-favicon.gif">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <script>
    (function() {
      var canvas = document.createElement('canvas');
      var size = 64;
      canvas.width = size;
      canvas.height = size;
      var ctx = canvas.getContext('2d');
      if (!ctx) return;

      var reduceMotion = window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var link = document.createElement('link');
      link.rel = 'icon';
      link.type = 'image/png';
      document.head.appendChild(link);

      var glyphs = [
        ['111', '100', '111', '001', '111'],
        ['010', '101', '111', '101', '101'],
        ['111', '010', '010', '010', '111']
      ];
      var dots = [];
      var cell = 5;
      var gap = 5;
      var glyphWidth = 3 * cell;
      var totalWidth = glyphWidth * 3 + gap * 2;
      var startX = (size - totalWidth) / 2 + cell / 2;
      var startY = 18;

      function hash(n) {
        var x = Math.sin(n * 127.1) * 43758.5453;
        return x - Math.floor(x);
      }

      for (var g = 0; g < glyphs.length; g++) {
        for (var y = 0; y < glyphs[g].length; y++) {
          for (var x = 0; x < glyphs[g][y].length; x++) {
            if (glyphs[g][y][x] !== '1') continue;
            var index = dots.length + 1;
            dots.push({
              x: startX + g * (glyphWidth + gap) + x * cell,
              y: startY + y * cell,
              r: 2.1,
              seed: hash(index),
              delay: (y * 0.055 + g * 0.035 + x * 0.018 + hash(index) * 0.08) % 0.42,
              lane: (hash(index + 10) - 0.5) * 5
            });
          }
        }
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function ease(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      function drawDot(x, y, r, alpha) {
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawFrame(still) {
        var now = Date.now();
        var t = still ? 0 : (now % 2200) / 2200;
        ctx.clearRect(0, 0, size, size);
        ctx.fillStyle = '#000';

        if (!still) {
          for (var j = 0; j < 5; j++) {
            var streamT = (t * 1.55 + j / 5) % 1;
            drawDot(
              32 + Math.sin(streamT * Math.PI * 2 + j) * 1.4,
              lerp(25, 39, streamT),
              0.9 + streamT * 0.35,
              0.18 + Math.sin(streamT * Math.PI) * 0.34
            );
          }
        }

        for (var i = 0; i < dots.length; i++) {
          var dot = dots[i];
          var p = still ? 0 : (t + dot.delay) % 1;
          var xPos = dot.x;
          var yPos = dot.y;
          var radius = dot.r;
          var alpha = 1;

          if (p < 0.52) {
            xPos += still ? 0 : Math.sin((now / 240) + dot.seed * 20) * 0.18;
            yPos += still ? 0 : Math.cos((now / 300) + dot.seed * 16) * 0.14;
          } else if (p < 0.7) {
            var intoNeck = ease((p - 0.52) / 0.18);
            xPos = lerp(dot.x, 32 + dot.lane * 0.35, intoNeck);
            yPos = lerp(dot.y, 29.5 + dot.seed * 4.5, intoNeck);
            radius = lerp(dot.r, 1.15, intoNeck);
            alpha = lerp(1, 0.86, intoNeck);
          } else if (p < 0.84) {
            var fall = (p - 0.7) / 0.14;
            xPos = 32 + dot.lane * Math.sin(fall * Math.PI) * 0.7;
            yPos = lerp(29, 39, fall * fall);
            radius = 1 + Math.sin(fall * Math.PI) * 0.35;
            alpha = 0.9;
          } else {
            var settle = ease((p - 0.84) / 0.16);
            var overshoot = Math.sin(settle * Math.PI) * (1 - settle) * 2.5;
            xPos = lerp(32 + dot.lane * 0.55, dot.x, settle);
            yPos = lerp(39, dot.y, settle) + overshoot;
            radius = lerp(1.2, dot.r, settle);
            alpha = clamp(0.75 + settle * 0.35, 0, 1);
          }

          drawDot(xPos, yPos, radius, alpha);
        }

        ctx.globalAlpha = 1;
        link.href = canvas.toDataURL('image/png');
      }

      drawFrame(reduceMotion);
      if (!reduceMotion) window.setInterval(function() { drawFrame(false); }, 125);
    })();
  </script>
  <style>
    @font-face {
      font-family: 'Berkeley Mono';
      src: local('Berkeley Mono'), local('BerkeleyMono-Regular');
      font-weight: 400;
      font-style: normal;
    }

    :root {
      --bg: #0a0a0a;
      --fg: #e8e8e8;
      --fg2: #9a9a9a;
      --fg3: #6e6e6e;
      --line: #222;
      --line2: #333;
      --sun: #f2c14e;
      --warn: #e0875a;
      --mono: 'Berkeley Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      font-size: 16px;
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--mono);
      font-size: 0.74rem;
      line-height: 1.55;
    }

    ::selection { background: var(--fg); color: var(--bg); }
    button, input, select { font: inherit; color: inherit; }
    a { color: inherit; }

    #root { min-height: 100vh; padding: 2.2rem 0.6rem 7.5rem; }
    .boot { padding: 2rem 1.4rem; color: var(--fg3); letter-spacing: 0.04em; }
    .boot::before { content: '▶ '; animation: arrow-blink 0.6s steps(1) infinite; }

    /* ── type ── */
    .k-h1 {
      font-size: 0.9rem;
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--fg);
    }
    .k-h2 {
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--fg);
      padding-top: 1rem;
      border-top: 1px solid var(--line);
    }
    .k-h3 {
      font-size: 0.62rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg2);
    }
    .k-text { display: block; font-size: 0.74rem; line-height: 1.55; color: var(--fg); }
    .k-text--small { font-size: 0.66rem; }
    .k-text--label { font-size: 0.66rem; letter-spacing: 0.06em; text-transform: uppercase; }
    .k-text--truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .k-tone-secondary { color: var(--fg2); }
    .k-tone-tertiary { color: var(--fg3); }
    .k-tone-quaternary { color: #555; }
    .k-hr { border: 0; height: 0; }

    .k-link {
      display: inline-flex;
      align-items: baseline;
      gap: 0.4rem;
      font-size: 0.66rem;
      line-height: 1.5;
      color: var(--fg);
      text-decoration: none;
    }
    .k-link::before { content: '→'; flex: none; }
    .k-link:hover::before { content: '▶'; animation: arrow-blink 0.6s steps(1) infinite; }

    /* ── surfaces ── */
    .k-card { border: 1px solid var(--line); min-width: 0; }
    .k-card-h {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.65rem 0.75rem;
      border-bottom: 1px solid var(--line);
    }
    .k-card-t { font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase; }
    .k-card-b { padding: 0.75rem; }

    .k-stat { border: 1px solid var(--line); padding: 0.65rem 0.75rem; min-width: 0; }
    .k-stat-l { font-size: 0.58rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg3); }
    .k-stat-v { margin-top: 0.3rem; font-size: 0.8rem; line-height: 1.35; }
    .k-stat--success .k-stat-v { color: var(--sun); }
    .k-stat--warning .k-stat-v, .k-stat--danger .k-stat-v { color: var(--warn); }

    .k-callout { border-left: 2px solid var(--fg); padding: 0.9rem 1.1rem; }
    .k-callout-t { font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.45rem; }
    .k-callout-b { font-size: 0.7rem; line-height: 1.6; color: var(--fg2); }

    /* ── controls ── */
    .k-btn {
      padding: 0.32rem 0.65rem;
      font-size: 0.66rem;
      line-height: 1.4;
      letter-spacing: 0.02em;
      background: rgba(10,10,10,0.72);
      border: 1px solid var(--line2);
      border-radius: 0;
      color: var(--fg2);
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
    }
    .k-btn:hover { border-color: #888; color: var(--fg); }
    .k-btn--primary { background: var(--fg); border-color: var(--fg); color: var(--bg); }
    .k-btn--primary:hover { background: #fff; border-color: #fff; color: #000; }
    .k-btn--ghost { background: transparent; border-color: transparent; color: var(--fg3); }
    .k-btn--ghost:hover { border-color: transparent; color: var(--fg); }
    .k-btn:disabled { opacity: 0.4; cursor: default; }

    .k-pill {
      display: inline-block;
      padding: 0.3em 0.85em 0.34em;
      font-size: 0.62rem;
      line-height: 1.35;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--fg);
      background: rgba(0,0,0,0.86);
      border: 1px solid rgba(232,232,232,0.4);
      border-radius: 0.95em;
      transition: background-color 0.08s ease-out, color 0.08s ease-out, border-color 0.08s ease-out;
    }
    button.k-pill { cursor: pointer; }
    button.k-pill:hover, button.k-pill:focus-visible, .k-pill--active {
      background: var(--fg);
      border-color: var(--fg);
      color: var(--bg);
      outline: none;
    }
    .k-pill--success { color: var(--sun); border-color: rgba(242,193,78,0.55); }
    .k-pill--warning { color: var(--warn); border-color: rgba(224,135,90,0.6); }

    .k-toggle {
      position: relative;
      flex: none;
      width: 24px;
      height: 13px;
      padding: 0;
      background: transparent;
      border: 1px solid #555;
      border-radius: 7px;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .k-toggle span {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #777;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }
    .k-toggle[aria-checked="true"] { background: var(--fg); border-color: var(--fg); }
    .k-toggle[aria-checked="true"] span { transform: translateX(11px); background: var(--bg); }

    .k-field {
      width: 100%;
      min-width: 0;
      padding: 0.38rem 0.55rem;
      font-size: 0.7rem;
      line-height: 1.4;
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--line2);
      border-radius: 0;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .k-field:hover, .k-field:focus { border-color: #888; }
    .k-field::placeholder { color: #555; }
    .k-select { position: relative; display: inline-block; min-width: 0; }
    .k-select select { appearance: none; -webkit-appearance: none; padding-right: 1.6rem; cursor: pointer; }
    .k-select::after {
      content: '▾';
      position: absolute;
      right: 0.55rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--fg3);
      pointer-events: none;
    }
    select.k-field option { background: #111; color: var(--fg); }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      height: 16px;
      background: transparent;
      cursor: pointer;
    }
    input[type="range"]:focus { outline: none; }
    input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: #444; }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 11px;
      height: 11px;
      margin-top: -5px;
      border: 0;
      border-radius: 50%;
      background: var(--fg);
    }
    input[type="range"]::-moz-range-track { height: 1px; background: #444; }
    input[type="range"]::-moz-range-thumb { width: 11px; height: 11px; border: 0; border-radius: 50%; background: var(--fg); }
    input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px rgba(232,232,232,0.25); }

    canvas:focus-visible, svg:focus-visible { outline: 1px solid #555; outline-offset: 2px; }

    /* ── tables ── */
    .k-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .k-table { width: 100%; border-collapse: collapse; font-size: 0.66rem; line-height: 1.5; }
    .k-table th {
      padding: 0.4rem 0.55rem;
      font-size: 0.58rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg3);
      border-bottom: 1px solid var(--line2);
      white-space: nowrap;
    }
    .k-table td { padding: 0.5rem 0.55rem; vertical-align: top; border-bottom: 1px solid #171717; }
    .k-table td:first-child { white-space: nowrap; }
    .k-table--striped tbody tr:nth-child(even) td { background: #0e0e0e; }

    /* ── chart ── */
    .k-chart { position: relative; width: 100%; }
    .k-chart text { font-family: var(--mono); }
    .k-chart-tip {
      position: absolute;
      width: 180px;
      padding: 0.45rem 0.6rem;
      font-size: 0.6rem;
      background: rgba(0,0,0,0.9);
      border: 1px solid rgba(232,232,232,0.4);
      pointer-events: none;
    }
    .k-chart-tip-h { letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.25rem; }
    .k-chart-tip-r { display: grid; grid-template-columns: 8px 1fr auto; align-items: center; gap: 0.4rem; color: var(--fg2); }
    .k-chart-tip-r b { font-weight: 400; color: var(--fg); }
    .k-chart-tip i, .k-legend i { display: inline-block; width: 8px; height: 2px; }
    .k-legend { display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; margin-top: 0.4rem; font-size: 0.6rem; color: var(--fg2); }
    .k-legend span { display: inline-flex; align-items: center; gap: 0.4rem; }
    .k-legend i { width: 12px; }

    /* ── site chrome, as on the home page ── */
    .chrome-fade {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 5.2rem;
      z-index: 9;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(10,10,10,0), rgba(10,10,10,0.92) 55%, #0a0a0a);
    }

    .nav-overlay {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      z-index: 10;
      list-style: none;
      font-size: 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .nav-overlay li { font-size: 0.6rem; line-height: 1; }
    .nav-overlay a {
      font-family: var(--mono);
      font-size: 0.6rem;
      color: #fff;
      text-decoration: none;
      letter-spacing: 0;
      transition: color 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      line-height: 1;
    }
    .nav-overlay a::before { content: '→'; color: #fff; transition: color 0.3s ease; }
    .nav-overlay a::after {
      content: '';
      display: inline-block;
      overflow: hidden;
      width: 0;
      opacity: 0;
      transition: width 0.2s ease, opacity 0.2s ease;
      animation: glyphs 0.4s steps(1) infinite;
      white-space: pre;
    }
    .nav-overlay a:hover::before { content: '▶'; animation: arrow-blink 0.6s steps(1) infinite; }
    .nav-overlay a:hover::after { width: 4ch; opacity: 1; }
    .nav-overlay a.active::before { content: '▶'; animation: none; }

    @keyframes glyphs {
      0%  { content: ' ░▒▓'; }
      14% { content: ' ▓░▒'; }
      28% { content: ' ▒▓░'; }
      42% { content: ' ◈◇◆'; }
      57% { content: ' ■□■'; }
      71% { content: ' ◆◇◈'; }
      85% { content: ' ▓▒░'; }
    }
    @keyframes arrow-blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    .site-id {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 10;
      display: flex;
      flex-direction: column;
      font-family: var(--mono);
      font-size: 0.6rem;
      line-height: 1.6;
      letter-spacing: 0.04em;
      text-align: right;
      color: #fff;
    }

    @media (max-width: 600px) {
      #root { padding: 1rem 0 2rem; }
      .chrome-fade { display: none; }
      .nav-overlay, .site-id { position: static; padding: 0 1.2rem; }
      .nav-overlay { margin-bottom: 1rem; }
      .site-id { text-align: left; padding-bottom: 2rem; }
      .k-table { min-width: 46rem; }
    }

    .gate {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.4rem;
      background: #0a0a0a;
    }
    html.open .gate { display: none; }
    html:not(.open) #root,
    html:not(.open) nav,
    html:not(.open) .chrome-fade,
    html:not(.open) .site-id,
    html:not(.open) noscript { display: none; }
    .gate form {
      width: min(22rem, 100%);
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }
    .gate h1 {
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--fg);
    }
    .gate p.note {
      font-size: 0.66rem;
      line-height: 1.5;
      color: var(--fg3);
    }
    .gate label {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg2);
    }
    .gate input {
      width: 100%;
      padding: 0.45rem 0.55rem;
      font: inherit;
      font-size: 0.74rem;
      letter-spacing: 0.02em;
      text-transform: none;
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--line2);
      border-radius: 0;
      outline: none;
    }
    .gate input:focus { border-color: #888; }
    .gate .row { display: flex; align-items: center; gap: 0.8rem; min-height: 1.6rem; }
    .gate .err { font-size: 0.66rem; color: var(--warn); letter-spacing: 0.03em; text-transform: none; }
    .gate button:disabled { opacity: 0.45; cursor: default; }
  </style>
</head>
<body>

<div class="gate" id="gate">
  <form id="gate-form" autocomplete="on">
    <h1>Näckrosvägen 29</h1>
    <p class="note">Private page. Enter the id and password to open the model.</p>
    <label>Id
      <input id="gate-id" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    </label>
    <label>Password
      <input id="gate-pw" name="password" type="password" autocomplete="current-password" required>
    </label>
    <div class="row">
      <button class="k-pill" type="submit">Enter</button>
      <span class="err" id="gate-err" role="alert"></span>
    </div>
  </form>
</div>

<main id="root"><p class="boot">Loading the model</p></main>
<noscript><p class="boot">This page is an interactive 3D model and needs JavaScript.</p></noscript>

<div class="chrome-fade"></div>

<nav>
  <ul class="nav-overlay">
    <li><a href="/">Home</a></li>
    <li><a href="/#portfolio">Portfolio</a></li>
    <li><a href="./" class="active" aria-current="page">Näckrosvägen 29</a></li>
  </ul>
</nav>

<div class="site-id">
  <div id="stockholm-clock"></div>
  <div>ssriramagiri.com</div>
</div>

<script>
(function () {
  var clockEl = document.getElementById('stockholm-clock');
  function updateClock() {
    var now = new Date();
    var opts = { timeZone: 'Europe/Stockholm', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
    var dateOpts = { timeZone: 'Europe/Stockholm', year: 'numeric', month: '2-digit', day: '2-digit' };
    var time = now.toLocaleTimeString('en-GB', opts);
    var date = now.toLocaleDateString('en-GB', dateOpts);
    var offset = new Date(now.toLocaleString('en-US', { timeZone: 'Europe/Stockholm' }));
    var utcOff = Math.round((offset - new Date(now.toLocaleString('en-US', { timeZone: 'UTC' }))) / 3600000);
    clockEl.textContent = 'Stockholm ' + date + ' ' + time + ' GMT' + (utcOff >= 0 ? '+' : '') + utcOff;
  }
  updateClock();
  setInterval(updateClock, 1000);
})();
