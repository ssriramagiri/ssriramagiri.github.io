  <script>
    (function() {
      var canvas = document.createElement('canvas');
      var size = 64;
      canvas.width = size;
      canvas.height = size;
      var ctx = canvas.getContext('2d');
      if (!ctx) return;

      var reduceMotion = window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var link = document.createElement('link');
      link.rel = 'icon';
      link.type = 'image/png';
      document.head.appendChild(link);

      var glyphs = [
        ['111', '100', '111', '001', '111'],
        ['010', '101', '111', '101', '101'],
        ['111', '010', '010', '010', '111']
      ];
      var dots = [];
      var cell = 5;
      var gap = 5;
      var glyphWidth = 3 * cell;
      var totalWidth = glyphWidth * 3 + gap * 2;
      var startX = (size - totalWidth) / 2 + cell / 2;
      var startY = 18;

      function hash(n) {
        var x = Math.sin(n * 127.1) * 43758.5453;
        return x - Math.floor(x);
      }

      for (var g = 0; g < glyphs.length; g++) {
        for (var y = 0; y < glyphs[g].length; y++) {
          for (var x = 0; x < glyphs[g][y].length; x++) {
            if (glyphs[g][y][x] !== '1') continue;
            var index = dots.length + 1;
            dots.push({
              x: startX + g * (glyphWidth + gap) + x * cell,
              y: startY + y * cell,
              r: 2.1,
              seed: hash(index),
              delay: (y * 0.055 + g * 0.035 + x * 0.018 + hash(index) * 0.08) % 0.42,
              lane: (hash(index + 10) - 0.5) * 5
            });
          }
        }
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function ease(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      function drawDot(x, y, r, alpha) {
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawFrame(still) {
        var now = Date.now();
        var t = still ? 0 : (now % 2200) / 2200;
        ctx.clearRect(0, 0, size, size);
        ctx.fillStyle = '#000';

        if (!still) {
          for (var j = 0; j < 5; j++) {
            var streamT = (t * 1.55 + j / 5) % 1;
            drawDot(
              32 + Math.sin(streamT * Math.PI * 2 + j) * 1.4,
              lerp(25, 39, streamT),
              0.9 + streamT * 0.35,
              0.18 + Math.sin(streamT * Math.PI) * 0.34
            );
          }
        }

        for (var i = 0; i < dots.length; i++) {
          var dot = dots[i];
          var p = still ? 0 : (t + dot.delay) % 1;
          var xPos = dot.x;
          var yPos = dot.y;
          var radius = dot.r;
          var alpha = 1;

          if (p < 0.52) {
            xPos += still ? 0 : Math.sin((now / 240) + dot.seed * 20) * 0.18;
            yPos += still ? 0 : Math.cos((now / 300) + dot.seed * 16) * 0.14;
          } else if (p < 0.7) {
            var intoNeck = ease((p - 0.52) / 0.18);
            xPos = lerp(dot.x, 32 + dot.lane * 0.35, intoNeck);
            yPos = lerp(dot.y, 29.5 + dot.seed * 4.5, intoNeck);
            radius = lerp(dot.r, 1.15, intoNeck);
            alpha = lerp(1, 0.86, intoNeck);
          } else if (p < 0.84) {
            var fall = (p - 0.7) / 0.14;
            xPos = 32 + dot.lane * Math.sin(fall * Math.PI) * 0.7;
            yPos = lerp(29, 39, fall * fall);
            radius = 1 + Math.sin(fall * Math.PI) * 0.35;
            alpha = 0.9;
          } else {
            var settle = ease((p - 0.84) / 0.16);
            var overshoot = Math.sin(settle * Math.PI) * (1 - settle) * 2.5;
            xPos = lerp(32 + dot.lane * 0.55, dot.x, settle);
            yPos = lerp(39, dot.y, settle) + overshoot;
            radius = lerp(1.2, dot.r, settle);
            alpha = clamp(0.75 + settle * 0.35, 0, 1);
          }

          drawDot(xPos, yPos, radius, alpha);
        }

        ctx.globalAlpha = 1;
        link.href = canvas.toDataURL('image/png');
      }

      drawFrame(reduceMotion);
      if (!reduceMotion) window.setInterval(function() { drawFrame(false); }, 125);
    })();

    .gate {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.4rem;
      background: #0a0a0a;
    }
    html.open .gate { display: none; }
    html:not(.open) #root, html:not(.open) noscript { display: none; }
    .gate form { width: min(22rem, 100%); display: flex; flex-direction: column; gap: 0.9rem; }
    .gate h1 { font-size: 0.68rem; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg); }
    .gate h1::before { content: '▶ '; }
    .gate p.note { font-size: 0.66rem; line-height: 1.5; color: var(--fg3); }
    .gate label { display: flex; flex-direction: column; gap: 0.35rem; font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg2); }
    .gate input {
      width: 100%;
      padding: 0.45rem 0.55rem;
      font: inherit;
      font-size: 0.74rem;
      letter-spacing: 0.02em;
      text-transform: none;
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--line2);
      border-radius: 0;
      outline: none;
    }
    .gate input:focus { border-color: #888; }
    .gate .row { display: flex; align-items: center; gap: 0.8rem; min-height: 1.6rem; }
    .gate .err { font-size: 0.66rem; color: var(--warn); letter-spacing: 0.03em; }
    .gate button:disabled { opacity: 0.45; cursor: default; }
  </style>
</head>
<body>
<div class="gate" id="gate">
  <form id="gate-form" autocomplete="on">
    <h1>Näckrosvägen 29</h1>
    <p class="note">Private page. Enter the id and password to open the workspace.</p>
    <label>Id
      <input id="gate-id" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    </label>
    <label>Password
      <input id="gate-pw" name="password" type="password" autocomplete="current-password" required>
    </label>
    <div class="row">
      <button class="pill" type="submit">Enter</button>
      <span class="err" id="gate-err" role="alert"></span>
    </div>
  </form>
</div>
<main id="root"><p class="boot">Loading the workspace</p></main>
<noscript><p class="boot">This page is an interactive workspace and needs JavaScript.</p></noscript>
